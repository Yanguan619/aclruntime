repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: test/json_for_arg_test\.json|test/testdata/fake_model\.json
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  # C++ 格式化：使用 clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.7
    hooks:
      - id: clang-format
        args:
          - "--style={BasedOnStyle: Google, IndentWidth: 4, AccessModifierOffset: -4}"

  # C++ 语法/风格检查：使用 cpplint
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.0
    hooks:
      - id: cpplint
        args:
          - '--linelength=120'
          - '--filter=-build/include_what_you_use,-build/include_order,-build/include_subdir,-build/include,-build/namespaces,-build/namespaces_headers,-runtime/references,-runtime/explicit,-runtime/int,-runtime/string,-runtime/threadsafe_fn,-whitespace/indent,-whitespace/indent_namespace,-whitespace/line_length,-readability/casting,-readability/alt_tokens,-readability/multiline_string,-readability/check,-legal/copyright,-readability/todo'
        exclude: third_party/|build/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
