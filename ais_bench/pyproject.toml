[project]
name = "ais-bench"
version = "0.1.0"
description = "A benchmarking tool for Ascend NPU inference"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yanguan", email = "yanguan_02@126.com" },
]
keywords = ["ascend", "npu", "benchmark", "inference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Benchmark",
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "tqdm",
    "tabulate",
    "typer",
]

[project.urls]
Homepage = "https://gitee.com/ascend/tools"
Repository = "https://gitee.com/ascend/tools"
Documentation = "https://gitee.com/ascend/tools"

[project.scripts]
ais-bench = "ais_bench:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["ais_bench"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_bench"]
